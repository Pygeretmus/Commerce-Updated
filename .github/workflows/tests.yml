name: Run Django Tests & Linters
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    timeout-minutes: 60
    strategy:
      max-parallel: 4
      matrix:
        python-version:
          - "3.13"
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgres://postgres:postgres_password@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.21"
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          uv sync --locked

      - name: Run tests
        run: |
          uv run manage.py test --settings=configuration.settings.test

      - name: Check for missing migrations
        run: |
          uv run manage.py makemigrations --check --dry-run --noinput --settings=configuration.settings.test

      - name: Check migrations (forward ➜ backward ➜ forward)
        run: |
          uv run manage.py migrate --noinput --settings=configuration.settings.test
          uv run manage.py migrate --noinput --settings=configuration.settings.test

  backend-lints:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.21"
          enable-cache: true
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          uv sync --locked

      - name: Run Formatter
        run: uv run ruff format --check --diff .
        # Update output format to enable automatic inline annotations.
      - name: Run Linter
        run: uv run ruff check --output-format=github .

  frontend-lints:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build frontend
        run: npm run build
